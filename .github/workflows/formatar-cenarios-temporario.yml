name: Formatar testes da galeria anime (temporário)
on:
  push:
    branches:
      - sol/10-cenarios-anime-horarios-20261104
    paths:
      - .github/workflows/formatar-cenarios-temporario.yml
permissions:
  contents: write
jobs:
  formatar:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prettier --write testes/sites-mobile/mobile-layout.teste.ts
      - name: Salvar formatação
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add testes/sites-mobile/mobile-layout.teste.ts
          if ! git diff --cached --quiet; then
            git commit -m "style(tests): formata validações da galeria anime"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
