name: Formatar documentação de infraestrutura
on:
  push:
    branches:
      - sol/infra-producao-video-20261103
    paths:
      - .github/workflows/formatar-infra-temporario.yml
permissions:
  contents: write
jobs:
  formatar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prettier --write README.md
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          if ! git diff --cached --quiet; then
            git commit -m "style(infra): normaliza README"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
