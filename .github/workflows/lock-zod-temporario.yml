name: Finalizar lockfile Zod 4.6.6
on:
  push:
    branches:
      - sol/patch-transitivas-sites-20261103
    paths:
      - .github/workflows/lock-zod-temporario.yml
permissions:
  contents: write
jobs:
  lockfile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --global pnpm@11.25.0
      - name: Instalar lockfile de forma reprodutível
        working-directory: versao-sites
        run: pnpm install --lockfile-only --no-frozen-lockfile
      - name: Registrar lockfile do Sites
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add versao-sites/pnpm-lock.yaml
          if ! git diff --cached --quiet; then
            git commit -m "chore(segurança): ajusta lockfile para Zod 4.6.6"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
