name: Formatação temporária do painel HLS
on:
  push:
    branches:
      - sol/painel-fila-hls-20261103
    paths:
      - .github/workflows/formatar-painel-hls-temporario.yml
permissions:
  contents: write
jobs:
  formatar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prettier --write src/routes/admin/+page.svelte
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/routes/admin/+page.svelte
          if ! git diff --cached --quiet; then
            git commit -m "style(admin): formata painel de conversões HLS"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
