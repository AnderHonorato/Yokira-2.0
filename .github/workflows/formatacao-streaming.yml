name: Corrigir formatação temporária de streaming
on:
  push:
    branches:
      - sol/streaming-seguro-uploads-20261102
    paths:
      - .github/workflows/formatacao-streaming.yml
permissions:
  contents: write
jobs:
  corrigir:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prettier --write testes/unitarios/fluxo-de-arquivo.teste.ts
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add testes/unitarios/fluxo-de-arquivo.teste.ts
          if ! git diff --cached --quiet; then
            git commit -m "style(video): formata testes de stream"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
