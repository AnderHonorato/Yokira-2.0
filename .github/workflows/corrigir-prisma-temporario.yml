name: Correção pontual de dependências Prisma
on:
  push:
    branches:
      - sol/corrigir-auditoria-prisma-20261103
    paths:
      - .github/workflows/corrigir-prisma-temporario.yml
permissions:
  contents: write
jobs:
  corrigir:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Corrigir pacotes de produção dentro das faixas já autorizadas
        run: |
          npm install --package-lock-only --ignore-scripts --no-audit
          npm audit fix --package-lock-only --omit=dev --no-fund || true
          npm audit --omit=dev --json > /tmp/prisma-audit.json || true
          node --input-type=module <<'JS'
          import { readFileSync } from 'node:fs';
          const a=JSON.parse(readFileSync('/tmp/prisma-audit.json','utf8'));
          console.log('Vulnerabilidades produção restantes:', JSON.stringify(a.metadata?.vulnerabilities));
          console.log('Pacotes:', JSON.stringify(Object.entries(a.vulnerabilities||{}).map(([name, v])=>({name,severity:v.severity,fix:v.fixAvailable}))));
          JS
      - name: Registrar atualização sem forçar mudanças major
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "fix(segurança): atualiza dependências transitivas Prisma"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
