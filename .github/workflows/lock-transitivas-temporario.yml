name: Atualizar transitivas Sites na branch de segurança
on:
  push:
    branches:
      - sol/patch-transitivas-sites-20261103
    paths:
      - .github/workflows/lock-transitivas-temporario.yml
permissions:
  contents: write
jobs:
  atualizar:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --global pnpm@11.25.0
      - name: Resolver apenas lockfile com patches de segurança
        working-directory: versao-sites
        run: pnpm install --lockfile-only --no-frozen-lockfile
      - name: Registrar lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add versao-sites/pnpm-lock.yaml
          if ! git diff --cached --quiet; then
            git commit -m "fix(segurança): trava dependências transitivas corrigidas"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
