# Testa a aplicação realmente publicada no Sites, separada da base Node/Svelte.
name: Verificações da versão Sites

on:
  pull_request:
    branches:
      - main-ChatGPT
  push:
    branches:
      - main-ChatGPT
      - 'sol/**'
    paths:
      - 'versao-sites/**'
      - '.github/workflows/verificacoes-sites.yml'

permissions:
  contents: read

jobs:
  sites:
    name: React/Vinext, D1 e segurança
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: versao-sites
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Preparar gerenciador PNPM
        run: npm install --global pnpm@11.25.0

      - name: Instalar dependências sem alterar o lockfile
        run: pnpm install --frozen-lockfile

      - name: Bloquear vulnerabilidades críticas nas dependências de produção
        run: pnpm audit --prod --audit-level=high

      - name: Checar os tipos da aplicação publicada
        run: pnpm run typecheck

      - name: Testar autenticação, dados e regras do backend
        run: pnpm test

      - name: Lint do frontend e do servidor
        run: pnpm run lint

      - name: Construir versão de produção Cloudflare
        run: pnpm run build

  mobile:
    name: Interface Sites em Chromium (390px e 1440px)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar Playwright do repositório e dependências Sites
        run: |
          npm ci
          npm install --global pnpm@11.25.0
          cd versao-sites
          pnpm install --frozen-lockfile

      - name: Instalar Chromium de teste
        run: npx playwright install --with-deps chromium

      - name: Verificar navegação inferior, encaixe dos cards e indicadores
        run: npx playwright test --config=playwright.sites.config.ts

      - name: Salvar relatório em caso de falha
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: relatorio-mobile-sites
          path: |
            playwright-report/
            test-results/
          retention-days: 7
