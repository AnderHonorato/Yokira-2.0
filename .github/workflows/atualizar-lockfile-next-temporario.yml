name: Atualizar lockfile Next em branch de segurança
on:
  push:
    branches:
      - sol/patch-next-seguranca-20261103
    paths:
      - .github/workflows/atualizar-lockfile-next-temporario.yml
permissions:
  contents: write
jobs:
  lockfile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --global pnpm@11.25.0
      - name: Regerar dependências travadas com versões corrigidas
        working-directory: versao-sites
        run: pnpm install --lockfile-only --no-frozen-lockfile
      - name: Salvar lockfile sem alterar a branch principal
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add versao-sites/pnpm-lock.yaml
          if ! git diff --cached --quiet; then
            git commit -m "chore(segurança): fixa Next.js 16.4.1 e sharp 0.35.5 no lockfile"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
