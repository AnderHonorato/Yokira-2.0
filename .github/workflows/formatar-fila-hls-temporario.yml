name: Formatar fila HLS temporariamente
on:
  push:
    branches:
      - sol/fila-hls-duravel-20261103
    paths:
      - .github/workflows/formatar-fila-hls-temporario.yml
permissions:
  contents: write
jobs:
  formatar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: |
          npx prettier --write scripts/trabalhador-hls.ts src/lib/servidor/processamento/fila-video.ts src/lib/servidor/processamento/transcodificar.ts src/lib/servidor/processamento/publicar-hls.ts testes/integracao/fila-video.teste.ts testes/unitarios/publicar-hls.teste.ts README.md
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/trabalhador-hls.ts src/lib/servidor/processamento/fila-video.ts src/lib/servidor/processamento/transcodificar.ts src/lib/servidor/processamento/publicar-hls.ts testes/integracao/fila-video.teste.ts testes/unitarios/publicar-hls.teste.ts README.md
          if ! git diff --cached --quiet; then
            git commit -m "style(hls): normaliza formatação da fila persistente"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
