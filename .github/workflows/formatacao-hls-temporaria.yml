name: Formatação pontual do teste HLS
on:
  push:
    branches:
      - sol/teste-real-ffmpeg-20261103
    paths:
      - .github/workflows/formatacao-hls-temporaria.yml
permissions:
  contents: write
jobs:
  formatar:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prettier --write scripts/testar-pipeline-hls.ts
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/testar-pipeline-hls.ts
          if ! git diff --cached --quiet; then
            git commit -m "style(video): formata teste integrado HLS"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
