name: Corrigir formatação da branch de estabilização

on:
  push:
    branches:
      - sol/estabilizacao-ci-seguranca-20261102
    paths:
      - .github/workflows/formatacao-da-branch.yml

permissions:
  contents: write

jobs:
  formatar:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Instalar dependências
        run: npm ci
      - name: Corrigir arquivos apontados pelo verificador
        run: |
          npx prettier --write \
            docs/entrega-2.0.md \
            prisma.config.ts \
            src/lib/servidor/banco/consumo.ts \
            src/lib/servidor/banco/social.ts \
            src/routes/api/social/+server.ts
      - name: Registrar formatação no PR
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/entrega-2.0.md prisma.config.ts src/lib/servidor/banco/consumo.ts src/lib/servidor/banco/social.ts src/routes/api/social/+server.ts
          if ! git diff --cached --quiet; then
            git commit -m "style: normaliza formatacao apontada pelo CI"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
