name: Formatação mobile temporária

on:
  push:
    branches:
      - sol/mobile-navbar-cards-glow-20261103
    paths:
      - .github/workflows/formatacao-mobile-temporaria.yml

permissions:
  contents: write

jobs:
  formatar:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Formatar testes do layout
        run: npx prettier --write testes/ponta-a-ponta/navegacao-mobile.teste.ts testes/sites-mobile/mobile-layout.teste.ts
      - name: Salvar correções de formato
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add testes/ponta-a-ponta/navegacao-mobile.teste.ts testes/sites-mobile/mobile-layout.teste.ts
          if ! git diff --cached --quiet; then
            git commit -m "style(tests): normaliza testes mobile para Prettier"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
