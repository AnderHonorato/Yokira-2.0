name: Formatacao temporaria do seed
on:
  push:
    branches:
      - sol/seed-producao-seguro-20261103
    paths:
      - .github/workflows/formatar-seed-temporario.yml
permissions:
  contents: write
jobs:
  formatar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prettier --write testes/unitarios/contas-demo-seguras.teste.ts
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add testes/unitarios/contas-demo-seguras.teste.ts
          if ! git diff --cached --quiet; then
            git commit -m "style(segurança): normaliza testes de seed seguro"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
