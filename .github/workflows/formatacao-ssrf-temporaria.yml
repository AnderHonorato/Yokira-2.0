name: Formatação pontual de segurança
on:
  push:
    branches:
      - sol/ssrf-ip-fixado-20261103
    paths:
      - .github/workflows/formatacao-ssrf-temporaria.yml
permissions:
  contents: write
jobs:
  formatar:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: |
          npx prettier --write src/lib/servidor/armazenamento/baixar-de-url.ts testes/unitarios/endereco-privado.teste.ts
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/servidor/armazenamento/baixar-de-url.ts testes/unitarios/endereco-privado.teste.ts
          if ! git diff --cached --quiet; then
            git commit -m "style(seguranca): normaliza formatacao de conexao fixada"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
