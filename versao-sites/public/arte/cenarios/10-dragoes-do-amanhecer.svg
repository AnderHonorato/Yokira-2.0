.cena-10-particula-viva{animation:cena-10-particulas 9s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes cena-10-nuvens{0%,100%{transform:translateX(-22px)}50%{transform:translateX(28px)}}
@keyframes cena-10-particulas{0%,100%{transform:translate(0,0) rotate(-5deg)}50%{transform:translate(22px,36px) rotate(22deg)}}
.cena-10-dragao-vivo{animation:cena-10-voo-dragao 9s ease-in-out infinite}
.cena-10-asa-dragao{animation:cena-10-asa 3s ease-in-out infinite}
